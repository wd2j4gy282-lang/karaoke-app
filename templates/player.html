<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ song.title }} - Karaoke</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/player.css">
</head>
<body>
  <div class="header">
    <a href="/" class="back-link">&larr; Library</a>
    <div class="song-title-wrap">
      <h1 class="song-title" id="song-title">{{ song.title }}</h1>
      <button class="rename-title-btn" id="rename-title-btn" title="Rename song">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 2l3 3L5 14H2v-3L11 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <canvas id="visualizer" width="800" height="120"></canvas>

  <div id="seek-bar">
    <div id="seek-progress"></div>
    <div id="seek-handle"></div>
  </div>
  <div id="time-display">
    <span id="time-current">0:00</span> / <span id="time-total">0:00</span>
  </div>

  <div id="lyrics"></div>

  <div id="pitch-meter">
    <div class="pitch-track">
      <div id="pitch-needle"></div>
      <div class="pitch-center-line"></div>
    </div>
    <div id="pitch-label">Enable mic to see pitch feedback</div>
  </div>

  <div id="controls">
    <button id="play-btn">Play</button>
    <button id="mic-btn">Enable Mic</button>
    <button id="sync-toggle-btn">Fine-tune Sync</button>
    <div id="score-display" class="hidden">Score: <span id="score-value">0</span>%</div>
  </div>

  <div id="sync-panel" class="hidden">
    <div class="sync-section">
      <label for="sync-offset-slider">Global offset: <span id="sync-offset-value">0.00s</span></label>
      <input type="range" id="sync-offset-slider" min="-2" max="2" step="0.05" value="0">
      <button id="sync-offset-save-btn">Save Offset</button>
      <p class="sync-hint">Negative = lyrics appear earlier, positive = later.</p>
    </div>
    <div class="sync-section">
      <button id="tap-sync-btn">Start Tap Sync</button>
      <p class="sync-hint" id="tap-sync-hint">
        Play the song, then tap (or press Space) at the start of each highlighted line.
      </p>
    </div>
  </div>

  <audio id="audio" src="/library/{{ song.id }}/instrumental.wav" preload="auto"></audio>

  <script>
    window.SONG_ID = {{ song.id | tojson }};
    window.SONG_TITLE = {{ song.title | tojson }};
  </script>
  <script type="module" src="/static/player.js"></script>
</body>
</html>
